<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>OceanQuote AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="text-center mb-4">

        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            class="img-fluid"
            style="max-height:140px;"
            alt="OceanQuote AI">

    </div>

    <div class="card">

        <div class="card-header">
            見積検索
        </div>

        <div class="card-body">

            <form method="GET">

                <div class="mb-3">

                    <label class="form-label">
                        荷主
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="shipper"
                        placeholder="荷主名を入力"
                        value="{{ request.args.get('shipper','') }}">

                </div>

                <div class="row">

                    <div class="col">

                        <label>POL</label>

                        <select class="form-select">

                            <option>選択してください</option>

                        </select>

                    </div>

                    <div class="col">

                        <label>POD</label>

                        <select class="form-select">

                            <option>選択してください</option>

                        </select>

                    </div>

                </div>

                <br>

                <div class="row">

                    <div class="col">

                        <label>船会社</label>

                        <select class="form-select">

                            <option>選択してください</option>

                        </select>

                    </div>

                    <div class="col">

                        <label>輸送形態</label>

                        <select class="form-select">

                            <option>FCL</option>
                            <option>LCL</option>

                        </select>

                    </div>

                </div>

                <br>

                <button
                    type="submit"
                    class="btn btn-primary">

                    🔍 検索

                </button>

                <button
                    type="reset"
                    class="btn btn-secondary">

                    リセット

                </button>

            </form>

        </div>

    </div>

    <br>

    <div class="card">

        <div class="card-header">
            検索結果
        </div>

        <table class="table table-hover">

            <thead>

                <tr>

                    <th>No</th>
                    <th>荷主</th>
                    <th>POL</th>
                    <th>POD</th>
                    <th>船会社</th>
                    <th>形態</th>
                    <th>単価</th>
                    <th>詳細</th>

                </tr>

            </thead>

            <tbody>

            {% for row in results %}

                <tr>

                    <td>{{ loop.index }}</td>

                    <td>{{ row["荷主名"] }}</td>

                    <td>{{ row["PlaceofReceiptCD"] }}</td>

                    <td>{{ row["PlaceofDeliveryCD"] }}</td>

                    <td>{{ row["CarrierCD"] }}</td>

                    <td>{{ row["作業形態CD"] }}</td>

                    <td style="text-align:right;">
                        {{ "{:,.0f}".format(row["請求項目単価"]|float) }}
                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-outline-primary">

                            詳細

                        </button>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
